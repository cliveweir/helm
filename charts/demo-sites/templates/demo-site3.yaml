    \       <div class=\"footer-content\">\n            <div class=\"footer-section\">\n
    \               <h4>Personal</h4>\n                <ul class=\"footer-links\">\n
    \                   <li><a href=\"#\" class=\"footer-link\">Checking</a></li>\n
