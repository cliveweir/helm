    class=\"feature-icon\">\U0001F4AC</div>\n                <h3>24/7 Support</h3>\n
    \               <p>Expert assistance whenever you need it</p>\n            </div>\n
    \           <div class=\"feature\">\n                <div class=\"feature-icon\">\U0001F3AF</div>\n
    \               <h3>Financial Tools</h3>\n                <p>Smart tools to help
    you reach your goals</p>\n            </div>\n        </div>\n    </section>\n\n
