apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-site1
data:
  config: |
    server {
        listen 8001;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  html: "<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\"
    />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"
    />\n    <title>Holiday Paradise</title>\n    <style>\n      body {\n        font-family:
    Arial, sans-serif;\n        margin: 0;\n        padding: 0;\n        background-color:
    #7dc2f2;\n        background-size: 100% auto;\n        background-position: center;\n
    \       background-repeat: no-repeat;\n        background-attachment: fixed;\n\n
    \       color: #333;\n      }\n      header {\n        background-color:#7d88f2;\n
    \       color: white;\n        padding: 15px 20px;\n        text-align: center;\n
    \     }\n      nav {\n        background-color: #264653;\n        color: white;\n
    \       padding: 10px 0;\n        text-align: center;\n      }\n      nav a {\n
    \       color: white;\n        margin: 0 15px;\n        text-decoration: none;\n
    \       font-weight: bold;\n      }\n      .info-box {\n  \n        text-align:
    center;\n        background-color: #7df2e8;\n        color: rgb(0, 0, 0);\n        padding:
    0.5px;\n        border-radius: 8px;\n        margin-top: 20px;\n      }\n      .container
    {\n        padding: 20px;\n      }\n      .people-options,\n      .continent-options
    {\n        display: flex;\n        justify-content: space-around;\n        flex-wrap:
    wrap;\n        gap: 20px;\n      }\n      .people-card {\n\n        background-color:
    #fff;\n        border: 1px solid #ccc;\n        padding: 20px;\n        cursor:
    pointer;\n        transition: transform 0.3s ease-in-out;\n      }\n\n      .continent-card
    {\n        background: white;\n        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);\n
    \       border-radius: 8px;\n        padding: 10px;\n        text-align: center;\n
    \       width: 200px;\n        transition: transform 0.3s ease-in-out;\n        cursor:
    pointer;\n      }\n      .continent-card img {\n        width: 100%;\n        border-radius:
    8px;\n      }\n      .people-card:hover,\n      .continent-card:hover {\n        transform:
    scale(1.2);\n      }\n\n      .people-card.selected {\n        transform: scale(1.2);\n
    \       background-color: #b51010;\n        border: 2px solid #007bff;\n      }\n\n
    \     .continent-card.selected {\n        transform: scale(1.2);\n        background-color:
    #b51010;\n        border: 2px solid #007bff;\n    \n      }\n      footer {\n
    \       background-color: #f27d88;\n        color: white;\n        text-align:
    center;\n        padding: 15x;\n        margin-top: 120px;\n        height: 200px;
    \n      }\n    </style>\n  </head>\n\n  <body>\n\n    <header>\n      <h1>Welcome
    to Paradise</h1>\n      <p>Find the holiday YOU want</p>\n    </header>\n\n    <nav>\n
    \     <a href=\"#people\">Book</a>\n      <a href=\"#contact\">Contact Us</a>\n
    \     <a href=\"#\">Reviews</a>\n    </nav>\n\n    <div class=\"container\" id=\"people\">\n
    \     <div class=\"info-box\">\n        <h2>Who's coming?</h2>\n      </div>\n\n
    \     <div class=\"people-options\">\n        <button id=\"card1\" class=\"people-card\">\n
    \         <h3>You</h3>\n          <p>A holiday for you, by you</p>\n        </button>\n
    \       <button id=\"card2\" class=\"people-card\">\n          <h3>Couple</h3>\n
    \         <p>The perfect getaway for time together</p>\n        </button>\n        <button
    id=\"card3\" class=\"people-card\">\n          <h3>Friends</h3>\n          <p>Time
    to party and have some fun</p>\n        </button>\n        <button id=\"card4\"
    class=\"people-card\">\n          <h3>Family</h3>\n          <p>Make special memories
    that will last a lifetime</p>\n          \n        </button>\n      </div>\n\n
    \   <div class=\"container\" id=\"continent\">\n      <div class=\"info-box\">\n
    \       <h2>Where do you want to go?</h2>\n      </div>\n      <div class=\"continent-options\">\n
    \       <button id=\"card5\" class=\"continent-card\">\n           <p> Europe
    </p>\n        </button>\n        <button id=\"card6\" class=\"continent-card\">\n
    \           <p> North America </p>\n        </button>\n        <button id=\"card7\"
    class=\"continent-card\">\n            <p> South America </p>\n        </button>\n
    \       <button id=\"card8\" class=\"continent-card\">\n            <p> Asia </p>\n
    \       </button>\n        <button id=\"card9\" class=\"continent-card\">\n            <p>
    Australia </p>\n        </button>\n        <button id=\"card10\" class=\"continent-card\">\n
    \           <p> Africa </p>\n        </button>\n      </div>\n    </div>\n\n    <footer>\n
    \     <div class=\"container\" id=\"contact\">\n        <h2>Contact Us</h2>\n
    \       <p>Phone: +1 234 567 890</p>\n        <p>Email: contact@holidayparadise.com</p>\n
    \       <p>Address: 123 Paradise Road, Dream City</p>\n      </div>\n    </footer>\n
    \ </body>\n</html>"