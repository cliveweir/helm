apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-sidecar-container
  labels:
    app.kubernetes.io/name: configmap-sidecar-container
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: configmap-sidecar-container
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configmap-sidecar-container
    spec:
      volumes:
        - name: demo-site1
          configMap:
            name: demo-site1
            items:
              - key: config
                path: config
              - key: html
                path: html
        - name: demo-site2
          configMap:
            name: demo-site2
            items:
              - key: config
                path: config
              - key: html
                path: html
        - name: demo-site3
          configMap:
            name: demo-site3
            items:
              - key: config
                path: config
              - key: html
                path: html
      containers:
        - name: demo-site1
          image: nginx
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: demo-site1
              mountPath: /usr/share/nginx/html/index.html
              subPath: html
            - name: demo-site1
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config
        - name: demo-site2
          image: nginx
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: demo-site2
              mountPath: /usr/share/nginx/html/index.html
              subPath: html
            - name: demo-site2
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config
        - name: demo-site3
          image: nginx
          ports:
            - containerPort: 8003
          volumeMounts:
            - name: demo-site3
              mountPath: /usr/share/nginx/html/index.html
              subPath: html
            - name: demo-site3
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config
